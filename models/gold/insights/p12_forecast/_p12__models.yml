version: 2
models:
  - name: int_p12_region_daily_series
    description: "P12: complete daily revenue (PHP) and data traffic (GB) series per region, the training input for the forecast."
    data_tests:
      - dbt_utils.unique_combination_of_columns: {arguments: {combination_of_columns: [event_date, region_id, metric]}}
    columns:
      - name: metric
        data_tests:
          - accepted_values: {arguments: {values: ['REVENUE_PHP', 'DATA_GB']}}
  - name: fct_p12_forecast
    description: "P12: 30-day Snowflake ML FORECAST per region and metric with 80% prediction interval; every run is kept (forecast_run_date)."
    data_tests:
      - dbt_utils.unique_combination_of_columns: {arguments: {combination_of_columns: [forecast_run_date, metric, region_id, forecast_date]}}
    columns:
      - name: horizon_days
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 1, max_value: 30}}
  - name: fct_p12_forecast_accuracy
    description: "P12: past forecasts against actuals: error, absolute percentage error, inside-interval flag."
  - name: mart_p12_forecast_region
    description: "P12: regional outlook: next 7 / 30 days forecast vs the last 30 actual days, expected change and measured accuracy (MAPE)."
    data_tests:
      - dbt_utils.unique_combination_of_columns: {arguments: {combination_of_columns: [region_id, metric]}}
