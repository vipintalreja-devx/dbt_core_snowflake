    columns:
      - name: adjustment_month
        data_tests: [not_null]
      - name: reason_code
        data_tests: [not_null]
      - name: region_name
        data_tests: [not_null]
      - name: credit_php
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0}}
  - name: agg_dunning_stage_daily
    description: "E05 - dunning actions per day x stage x action x region with cure rate."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [action_date, dunning_stage, dunning_action, region_name]}
