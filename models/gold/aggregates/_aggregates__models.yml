version: 2

# GOLD / AGGREGATES - ported from telco_v2_core easy models x_e01..x_e29 (PIPE_X.SP_X_E01..E29).
# Each procedure computed ONE day/month per CALL; these maintain the whole history window.

models:
  - name: agg_recharge_daily_channel
    description: "E01 - prepaid top-ups per day x channel x pack x home region (share of day, DoD, 7-day avg, busy hour)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [event_date, recharge_channel, pack_code, home_region_name]}
    columns:
      - name: event_date
        data_tests: [not_null]
      - name: recharge_channel
        data_tests: [not_null]
      - name: pack_code
        data_tests: [not_null]
      - name: home_region_name
        data_tests: [not_null]
      - name: amount_php
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0}}
  - name: agg_payment_daily_method
    description: "E02 - cash collected per day x channel x method, punctuality vs due date, amount by island (OBJECT_AGG)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [payment_date, payment_channel, payment_method]}
    columns:
      - name: payment_date
        data_tests: [not_null]
      - name: payment_channel
        data_tests: [not_null]
      - name: payment_method
        data_tests: [not_null]
      - name: amount_php
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0}}
      - name: late_payment_pct
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 100}}
  - name: agg_invoice_status_monthly
    description: "E03 - invoices per billing month x status x region with collection rate and MoM."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [billing_month, invoice_status, region_name]}
    columns:
      - name: billing_month
        data_tests: [not_null]
      - name: invoice_status
        data_tests: [not_null]
      - name: region_name
        data_tests: [not_null]
      - name: invoices
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 1}}
  - name: agg_adjustment_reason_monthly
    description: "E04 - credits per month x reason x region with outage context for OUTAGE_CREDIT."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
